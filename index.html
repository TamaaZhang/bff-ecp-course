<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>BFF 實作課</title>
<style>
/* 配色和各階段頁一樣，參考 Google Codelabs。 */
:root {
  --page: #e8eaed; --card: #ffffff; --text: #4e5256; --strong: #202124; --muted: #5f6368; --blue: #1a73e8;
  --shadow: 0 1px 2px 0 rgba(60, 64, 67, .3), 0 2px 6px 2px rgba(60, 64, 67, .15);
  --sans: "Google Sans", Roboto, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/24px var(--sans); }
.topbar { height: 64px; display: flex; align-items: center; padding: 0 24px; background: var(--card); box-shadow: var(--shadow); }
.topbar h1 { margin: 0; font-size: 20px; font-weight: 400; color: #3c4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { max-width: 800px; margin: 0 auto; padding: 32px 24px 64px; }
.lead { font-size: 16px; margin: 0 0 24px; }
.cards { display: grid; gap: 16px; }
a.card { display: flex; gap: 16px; align-items: flex-start; padding: 20px 24px; background: var(--card); border-radius: 4px; box-shadow: var(--shadow); color: inherit; text-decoration: none; transition: box-shadow .2s; }
a.card:hover { box-shadow: 0 1px 3px 0 rgba(60, 64, 67, .3), 0 4px 8px 3px rgba(60, 64, 67, .15); }
a.card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.card .num { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-size: 16px; }
.card .tag { color: var(--muted); font-size: 13px; }
.card .name { font-size: 18px; color: var(--strong); margin: 2px 0 4px; }
.card .desc { color: var(--text); }
@media (max-width: 600px) {
  .topbar { padding: 0 16px; }
  main { padding: 20px 16px 48px; }
  a.card { padding: 16px; }
}
</style>
</head>
<body>
<header class="topbar"><h1>BFF 實作課：會議室預約看板</h1></header>
<main>
  <p class="lead">程式由 AI 照規範寫，你負責看懂和驗收。先用 Google Sheet 當資料來源，再整個改接 ECP。照順序做：</p>
  <div class="cards">
    <a class="card" href="stage1.html">
      <span class="num">1</span>
      <div>
        <div class="tag">階段一 · Google Sheet</div>
        <div class="name">Sheet 版：查詢，再加上新增、修改、刪除</div>
        <div class="desc">複製試算表範本、部署 Apps Script，請 AI 先做查詢、再做新增修改刪除，每一段都自己驗收。</div>
      </div>
    </a>
    <a class="card" href="stage2.html">
      <span class="num">2</span>
      <div>
        <div class="tag">階段二 · 本地 ECP</div>
        <div class="name">建立 ECP 單元</div>
        <div class="desc">用 QS 建字典、兩個單元與欄位，手動建範例資料。不用寫程式。</div>
      </div>
    </a>
    <a class="card" href="stage3.html">
      <span class="num">3</span>
      <div>
        <div class="tag">階段三 · 本地 ECP</div>
        <div class="name">改接 ECP（準備中）</div>
        <div class="desc">只換 BFF 的資料來源轉接層，前端、GraphQL、業務規則都不用改。</div>
      </div>
    </a>
  </div>
</main>
</body>
</html>
